services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bol_admin
      POSTGRES_PASSWORD: bol_admin_password
      POSTGRES_DB: bol_generator
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bol_admin -d bol_generator"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://bol_admin:bol_admin_password@db:5432/bol_generator?schema=public
      # Change this before exposing the app beyond your own machine — see README.
      AUTH_SECRET: ${AUTH_SECRET:-change-this-to-a-random-value-before-going-live}
      AUTH_TRUST_HOST: "true"
      NODE_ENV: production
    ports:
      - "3000:3000"
    volumes:
      # A named (not bind-mounted) volume: Docker auto-copies the image's
      # baked-in storage/templates/ into it on first run, then persists both
      # that and storage/generated/ across restarts and image rebuilds.
      - storage_data:/app/storage

volumes:
  db_data:
  storage_data:
